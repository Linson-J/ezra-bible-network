name: ezra_bible_network
description: "Ezra Bible Network — live stream, program schedule and daily verse."
publish_to: 'none'

# versionName+versionCode. Bump the number after + for every Play Store upload.
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Pinned exactly: android/.../PlaybackService.kt relies on this version's
  # media notification id.
  better_player_plus: 1.0.8
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  connectivity_plus: ^7.3.1
  cached_network_image: ^3.4.1
  http: ^1.6.0
  provider: ^6.1.5+1
  package_info_plus: ^9.0.1
  wakelock_plus: ^1.4.0
  cupertino_icons: ^1.0.8
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/
    - assets/images/
    - assets/instagram.png
    - assets/youtube.png
    # Lottie animations
    - assets/likes.json
    - assets/live-streaming.json
    - assets/post.json
    - assets/social-media.json
  # OFL licences in assets/fonts/.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
    - family: ArchivoCondensed
      fonts:
        - asset: assets/fonts/ArchivoCondensed-ExtraBold.ttf
          weight: 800
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: "#0E0B2A"
  adaptive_icon_foreground: assets/images/logo.png
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 23

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#000000"
  image: assets/images/logo.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#000000"
    image: assets/images/logo.png
